<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Orbit</title>
  <link rel="stylesheet" href="style.css?v=20260920.20" />
  <link rel="stylesheet" href="mobile-controls.css?v=20260920.20" />
  <link rel="stylesheet" href="title-screen.css?v=20260920.20" />
  <link rel="stylesheet" href="orbit-board.css?v=20261016.2" />
  <link rel="stylesheet" href="reward-cards.css?v=20260920.20" />
  <link rel="stylesheet" href="orbit-overdrive.css?v=20261018.1" />
  <link rel="stylesheet" href="orbit-impact.css?v=20261017.3" />
  <link rel="stylesheet" href="orbit-adventures.css?v=20261018.2" />
  <link rel="stylesheet" href="orbit-help.css?v=20261018.3" />
  <link rel="stylesheet" href="orbit-hud.css?v=20261019.1" />
</head>
<body class="title-screen-active">
  <canvas id="game" aria-label="Orbit game canvas"></canvas>

  <header class="hud-header">
    <div class="hud-left">
      <div class="control-panel" aria-label="Game controls">
        <button id="pause" class="control-button pause-button" type="button" aria-label="Pause game" disabled>⏸</button>
        <button id="reset" class="control-button reset-button" type="button" aria-label="Reset run" disabled>↻</button>
        <button id="sound" class="control-button sound-button" type="button" aria-label="Mute sound effects">🔊</button>
        <div class="orbit-volume-anchor">
          <label class="music-volume" aria-label="Music volume">
            <span aria-hidden="true">♫</span>
            <input id="music-volume" type="range" min="0" max="100" value="100" />
          </label>
        </div>
        <button id="board" class="control-button board-button" type="button" aria-label="Open Starboard">★</button>
        <button id="help" class="control-button help-button" type="button" aria-label="How to Play" title="How to Play">?</button>
      </div>
    </div>
    <div class="title">ORBIT</div>
    <div class="hud-right">
      <div class="stats">
        <span>Score <strong id="score">0</strong></span>
        <span>Lives <strong id="lives">3</strong></span>
        <span>Cycle <strong id="cycle">1</strong></span>
        <span>Run <strong id="level">1</strong></span>
      </div>
    </div>
  </header>

  <div class="instruction" id="instruction">
    <strong>TRAINING ORBIT</strong>
    <span>Tap planet to move outward.</span>
    <span>Tap rings to move inward.</span>
    <span>Dodge pink debris.</span>
    <span>Reach the outer orbit.</span>
  </div>

  <div class="mobile-controls" id="mobileControls" aria-label="Mobile movement controls" aria-hidden="true">
    <button id="mobile-in" class="mobile-move-button mobile-in-button" type="button" aria-label="Move inward" disabled>IN</button>
    <button id="mobile-out" class="mobile-move-button mobile-out-button" type="button" aria-label="Move outward" disabled>OUT</button>
  </div>

  <div id="message" class="message"></div>

  <script>
    (() => {
      const difficultyShortcutCodes = new Set(["Digit1", "Digit2", "Digit3", "Numpad1", "Numpad2", "Numpad3"]);

      window.addEventListener(
        "keydown",
        (event) => {
          if (!difficultyShortcutCodes.has(event.code)) return;

          const target = event.target;
          if (!target) return;

          const editable =
            target.isContentEditable ||
            target.matches?.("input, textarea, select, [contenteditable='true'], [contenteditable='']");

          if (editable) {
            event.stopImmediatePropagation();
          }
        },
        { capture: true }
      );
    })();
  </script>
  <script src="game.js?v=20261016.5"></script>
  <script src="balance.js?v=20261016.3"></script>
  <script src="planet.js?v=20261015.9"></script>
  <script src="screens.js?v=20261016.4"></script>
  <script src="orbit-events.js?v=20261016.4"></script>
  <script src="orbit-alert-card.js?v=20260920.20"></script>
  <script src="orbit-upgrades.js?v=20261019.1"></script>
  <script src="audio.js?v=20260920.20"></script>
  <script src="orbit-music.js?v=20260920.20"></script>
  <script src="mobile-controls.js?v=20261018.3"></script>
  <script src="title-screen.js?v=20261019.1"></script>
  <script src="orbit-board-cloud.js?v=20261016.2"></script>
  <script src="orbit-moments.js?v=20261016.6"></script>
  <script src="orbit-weather.js?v=20261015.9"></script>
  <script src="orbit-ringfall.js?v=20261015.8"></script>
  <script src="orbit-early-moments.js?v=20261016.6"></script>
  <script src="orbit-overdrive.js?v=20261018.1"></script>
  <script src="orbit-impact.js?v=20261017.3"></script>
  <script src="orbit-nova.js?v=20261017.4"></script>
  <script src="orbit-adventures.js?v=20261018.2"></script>
  <script src="orbit-help.js?v=20261018.3"></script>
  <script src="orbit-hud.js?v=20261019.1"></script>
</body>
</html>
